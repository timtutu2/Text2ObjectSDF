# configs/default.yaml

experiment_name: "text2object_baseline"

# Logging (TensorBoard + optional Weights & Biases)
logging:
  log_dir: "/mnt/tim/text2objectsdf/logs"   # TensorBoard and run subdirs
  wandb_project: "text2object-sdf"
  wandb_enabled: true   # Set WANDB_API_KEY in env (e.g. K8s secret) to log to wandb

version:
  name: "10000_two_stage_training_stage1"

# 1. Network Architecture
model:
  text_embed_dim: 512       # CLIP ViT-B/32 output dimension.
  latent_dim: 128           # VAE latent space dimension (z).
  hidden_dim: 256           # FiLM decoder hidden layer width.
  num_layers: 4             # Number of FiLM decoder layers.

  num_embeddings: 512       # VQ codebook size.

  hashgrid:
    n_levels: 16
    n_features_per_level: 4
    log2_hashmap_size: 21
    base_resolution: 16

# 2. Training Hyperparameters
# If SDF at inference is always positive (no zero-crossing), try num_epochs: 200–300.
training:
  stage: "stage1"          # "stage1": train shape VQ+decoder, "stage2": train text prior only.
  batch_size: 32
  num_workers: 8
  num_epochs: 800   #default 
  num_epochs_stage1: 800
  num_epochs_stage2: 200
  learning_rate: 0.0005
  points_per_batch: 4096
  save_interval: 50
  grad_accum_steps: 8
  warmup_epochs: 160        # Phase 1: linear ramp from ~0 → lr.
  stable_epochs: 300        # Phase 2: constant at lr  (800-100-300 = 400 decay epochs).
  amp: false
  
# 3. Loss Weights
loss:
  truncation_dist: 0.07      # SDF truncation distance (tau).
  lambda_sdf: 5.0            # Weight for truncated SDF loss. Try 2–5 if inference SDF is all-positive.
  lambda_codebook: 1.0       # Weight for VQ codebook loss (moves codebook → encoder).
  commitment_cost: 0.25     # Weight for commitment loss β (moves encoder → codebook).
  lambda_eik: 0.01          # Eikonal regularization weight.
  lambda_prior: 1.0         # Stage2 prior CE weight (if used in combined loss wrappers).
  lambda_far: 0.1           # Weight for far-field SDF loss (|sdf_gt| > τ region).

# 4. Inference / Meshing
inference:
  resolution: 128           # Marching Cubes grid resolution.
  chunk_size: 100000        # Points per chunk to avoid OOM.
  threshold: 0.0            # Iso-surface threshold (zero-level set).
  temperature: 1.0          # Sampling temperature for p(token | text).
  top_k: 0                  # 0/absent disables top-k filter.
  top_p: 1.0                # 1.0 disables nucleus sampling.
  deterministic: false      # If true: argmax token instead of stochastic sampling.
